<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大观园试才题对额 · 卷轴</title>
<style>
*{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
html,body{height:100%}
.rpg-scene, .rpg-scene *{
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.rpg-scene button,
.rpg-scene .rpg-dialog{
  outline: none;
}
  body{
    background:radial-gradient(ellipse at 50% 35%, #1a1710 0%, #0d0b08 60%, #060504 100%);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    color:#e8dcc0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(200,170,100,.05) 1px, transparent 1px);
    background-size:3px 3px;opacity:.5;
  }
  .app{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:16px;
  }

  .titlebar{
    display:flex;align-items:center;gap:14px;
    opacity:0;transform:translateY(-8px);
    transition:opacity 1s ease .5s, transform 1s ease .5s;
  }
  body.ready .titlebar{opacity:1;transform:translateY(0)}
  .titlebar .cn{
    font-size:clamp(16px,2.1vw,24px);letter-spacing:.36em;
    color:#e3cf9c;text-shadow:0 0 18px rgba(200,160,70,.35);
    padding-left:.36em;
  }
  .titlebar .seal{
    width:26px;height:26px;border:1px solid #9b3a30;border-radius:3px;
    color:#c25a4a;font-size:11px;display:flex;align-items:center;justify-content:center;
    line-height:1.1;box-shadow:0 0 10px rgba(180,60,40,.25) inset;
  }
  .titlebar .sub{font-size:11px;color:#7d7b6c;letter-spacing:.22em}

  .scroll{
    position:relative;
    width:min(94vw, 1240px, calc(72vh * 1.7778));
    aspect-ratio:16/9;
    filter:drop-shadow(0 24px 60px rgba(0,0,0,.9));
  }
  .paper{
    position:absolute;inset:0;overflow:hidden;
    clip-path:inset(0 50% 0 50%);
    background:#c9d8e0;border-radius:2px;
  }
  .paper::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(ellipse 62% 52% at 72% 20%, rgba(255,238,190,.18), transparent 72%),
      radial-gradient(ellipse at 50% 52%, transparent 52%, rgba(45,32,14,.50) 100%);
    box-shadow:inset 0 0 70px rgba(30,20,5,.55);
  }
  .paper::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,90,50,.045) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,90,50,.032) 0 1px, transparent 1px 4px);
    mix-blend-mode:multiply;
  }
  canvas{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .rod{
    position:absolute;top:50%;width:15px;height:108%;
    transform:translate(-50%,-50%);border-radius:8px;
    background:linear-gradient(90deg,#20140c 0%,#5a3d22 22%,#8a6338 46%,#a87d47 54%,#4a3220 78%,#1c1109 100%);
    box-shadow:0 0 22px rgba(0,0,0,.9), inset 0 0 8px rgba(0,0,0,.7);
    z-index:6;
  }
  .rod::before,.rod::after{
    content:'';position:absolute;left:50%;transform:translateX(-50%);
    width:23px;height:11px;border-radius:4px;
    background:linear-gradient(90deg,#6d5222,#d9b45c 40%,#f0d894 50%,#a8843c 70%,#5a431c);
    box-shadow:0 0 10px rgba(220,180,90,.35);
  }
  .rod::before{top:-7px}
  .rod::after{bottom:-7px}
  #rodL{left:50%}
  #rodR{left:50%}

  .placard { position:absolute; left:50%; top:21%; z-index:11; pointer-events:none; opacity:0; transform:translate(-50%,-50%); will-change:transform,opacity; }
  .placard.show{animation:placardIn .24s steps(5,end) forwards;}
  .placard.clickable.show{pointer-events:auto; cursor:pointer;}
  @keyframes placardIn{ 0% {opacity:0;transform:translate(-50%,-50%) scale(.55,1.55);} 40% {opacity:1;transform:translate(-50%,-50%) scale(1.10,1);} 72% {opacity:1;transform:translate(-50%,-50%) scale(.96,1);} 100%{opacity:1;transform:translate(-50%,-50%) scale(1,1);} }
  .placard.hide{animation:placardOut .16s steps(3,end) forwards; pointer-events:none;}
  @keyframes placardOut{ 0% {opacity:1;transform:translate(-50%,-50%) scale(1,1);} 100% {opacity:0;transform:translate(-50%,-50%) scale(.62,1.45);} }
  .placard-inner{ position:relative; display:flex; align-items:center; gap:11px; padding:8px 20px 8px 10px; background:#17130c; border:2px solid #d9b45c; box-shadow: 0 0 0 2px #060504, 0 0 0 4px #7a5c22, 6px 6px 0 rgba(0,0,0,.55), inset 0 0 0 1px rgba(240,215,150,.12); }
  .placard-inner::before{ content:''; position:absolute; inset:-2px; pointer-events:none; background: linear-gradient(#efd27a,#efd27a) 0 0/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 100% 0/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 0 100%/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 100% 100%/4px 4px no-repeat; opacity:.75; }
  .placard-no{ flex:none; width:22px; height:22px; display:flex; align-items:center; justify-content:center; background:#b8402f; border:2px solid #d9a86a; box-shadow:0 0 0 2px #060504; color:#fbeecb; font-size:12px; line-height:1; }
  .placard-name{ font-size:clamp(15px,2.1vw,25px); letter-spacing:.26em; color:#f6e6b8; text-shadow:2px 2px 0 #000, 0 0 16px rgba(217,180,92,.45); white-space:nowrap; padding-left:.26em; }
  .placard-name::before,.placard-name::after{ content:''; display:inline-block; width:5px; height:5px; background:#d9b45c; transform:rotate(45deg); vertical-align:middle; margin:0 11px 4px; box-shadow:0 0 7px rgba(217,180,92,.85); }

  .dialog{ position:absolute; left:2.2%; top:3.4%; width:min(42%, 440px); z-index:9; pointer-events:none; opacity:0; filter:drop-shadow(0 10px 22px rgba(0,0,0,.7)); }
  .dialog.show{animation:dlgIn .22s steps(5,end) both;}
  @keyframes dlgIn{ 0%{opacity:0;transform:translate(-14px,-10px) scale(.90);} 60%{opacity:1;transform:translate(2px,1px) scale(1.012);} 100%{opacity:1;transform:translate(0,0) scale(1);} }
  .dialog.hide{animation:dlgOut .16s steps(3,end) both;}
  @keyframes dlgOut{ 0%{opacity:1;transform:translate(0,0) scale(1);} 100%{opacity:0;transform:translate(-10px,-6px) scale(.94);} }
  .dlg-inner{ position:relative; background:#14110b; border:2px solid #c9a54a; box-shadow: 0 0 0 2px #060504, 0 0 0 4px #6e5322, inset 0 0 0 1px rgba(240,215,150,.14), inset 0 0 30px rgba(0,0,0,.85); padding:0 11px 10px; overflow:hidden; }
  .dlg-inner::before{ content:''; position:absolute; inset:-2px; pointer-events:none; background: linear-gradient(#efd27a,#efd27a) 0 0/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 100% 0/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 0 100%/4px 4px no-repeat, linear-gradient(#efd27a,#efd27a) 100% 100%/4px 4px no-repeat; opacity:.55; }
  .dlg-bar{ display:flex; align-items:center; justify-content:space-between; margin:0 -11px 7px; padding:2px 11px; background:#7a241c; border-bottom:2px solid #060504; box-shadow:inset 0 -1px 0 rgba(240,215,150,.30); }
  .dlg-bar-t{ font-size:9px; letter-spacing:.30em; color:#f6e8c4; text-shadow:1px 1px 0 rgba(0,0,0,.7); }
  .dlg-step{ font-size:8.5px; letter-spacing:.12em; color:#e8cf9a; opacity:.9; text-shadow:1px 1px 0 rgba(0,0,0,.7); }
  .dlg-head{ display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .dlg-no{ flex:none; width:16px; height:16px; display:flex; align-items:center; justify-content:center; background:#b8402f; border:1px solid #d9a86a; color:#fbeecb; font-size:9.5px; line-height:1; }
  .dlg-name{ font-size:clamp(10.5px,1.15vw,13px); letter-spacing:.10em; color:#f4e2b0; text-shadow:1px 1px 0 rgba(0,0,0,.8); }
  .dlg-plaque{ font-size:clamp(9px,.98vw,11px); color:#d0aa55; letter-spacing:.04em; line-height:1.65; margin-bottom:6px; padding-bottom:6px; border-bottom:1px dashed rgba(200,165,90,.26); }
  .dlg-text{ font-size:clamp(9px,.85vw,10.5px); line-height:1.72; color:#a6a698; letter-spacing:.02em; min-height:4.6em; text-align:justify; }
  .dlg-foot{ display:flex; align-items:center; gap:6px; margin-top:7px; height:auto; min-height:14px; }
  .dlg-tri{ font-size:7px; color:#d9b45c; animation:triBlink .9s steps(1) infinite; }
  @keyframes triBlink{0%,49%{opacity:1}50%,100%{opacity:.12}}
  .dlg-hint{ font-size:8.5px; letter-spacing:.14em; color:#6f7064; }
  .dlg-progress{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(200,165,90,.10); }
  .dlg-progress i{ display:block; height:100%; width:0; background:repeating-linear-gradient(90deg, #e8c95a 0 4px, rgba(0,0,0,0) 4px 6px); box-shadow:0 0 6px rgba(232,201,90,.5); }
  .dialog.enterable{ pointer-events:auto; }
  .dlg-enter{ margin-left:auto; font-family:inherit; font-size:8.5px; letter-spacing:.14em; color:#f6e6b8; background:#7a241c; border:1px solid #d9a86a; padding:2px 7px; cursor:pointer; box-shadow:0 0 0 1px #060504, 1px 1px 0 rgba(0,0,0,.6); animation:enterPulse 1.6s ease-in-out infinite; }
  @keyframes enterPulse{ 0%,100%{ box-shadow:0 0 0 1px #060504, 1px 1px 0 rgba(0,0,0,.6), 0 0 0 rgba(217,180,92,0); } 50% { box-shadow:0 0 0 1px #060504, 1px 1px 0 rgba(0,0,0,.6), 0 0 10px rgba(217,180,92,.8); } }
  .dlg-enter:hover{ background:#9a3024; color:#fff6d8; }

  .bar{ display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(8px); transition:opacity 1s ease .8s, transform 1s ease .8s; }
  body.ready .bar{opacity:1;transform:translateY(0)}
  .btn{ background:#14110b; color:#c6b183; border:2px solid #6e5322; box-shadow:0 0 0 2px #060504, 2px 2px 0 rgba(0,0,0,.6); padding:5px 14px; font-family:inherit; font-size:11.5px; letter-spacing:.2em; cursor:pointer; border-radius:0; transition:color .15s, border-color .15s, background .15s, transform .08s steps(2,end), box-shadow .08s steps(2,end); }
  .btn:hover{ color:#f0dfae; border-color:#c9a54a; background:#1e180f; transform:translate(-1px,-1px); box-shadow:0 0 0 2px #060504, 3px 3px 0 rgba(0,0,0,.6); }
  .btn:active{ transform:translate(1px,1px); box-shadow:0 0 0 2px #060504, 1px 1px 0 rgba(0,0,0,.6); }
  .dots{display:flex;gap:6px}
  .dot{ width:8px; height:8px; border-radius:0; background:#2a2416; border:1px solid #6e5322; cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s; padding:0; }
  .dot.on{ background:#e8c95a; border-color:#f6e6b8; box-shadow:0 0 8px rgba(232,201,90,.85); }

  /* ========== 复古 RPG 界面 ========== */
  .rpg-scene {
  position: fixed; inset: 0; z-index: 999;
  background: #000;
  display: flex;
  align-items: center; justify-content: center;
  overflow: hidden;
  font-family: "Songti SC","STSong","SimSun","Noto Serif SC",serif;
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s ease, visibility .5s;
  }
  .rpg-scene.show {
  opacity: 1;
  visibility: visible;
  }
  .rpg-bg {
    position: absolute; inset: 0;
    background-color: #111;
    background-size: cover; background-position: center;
    image-rendering: pixelated;
    filter: brightness(0.85) contrast(1.1);
  }

  .rpg-chars {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 2;
  }
  .rpg-char {
    position: absolute; bottom: 0;
    height: clamp(300px, 58vh, 680px);
    object-fit: contain;
    image-rendering: pixelated;
    transition: transform .35s ease, opacity .35s ease, filter .35s ease;
    opacity: 0; transform: translateY(24px);
  }
  .rpg-char.left  { left: 5%; }
  .rpg-char.right { right: 5%; }
  .rpg-char.active {
    opacity: 1; transform: translateY(0);
    filter: brightness(.62) saturate(.75);
  }
  .rpg-char.speaking {
    transform: translateY(-10px) scale(1.03);
    filter: brightness(1.15) saturate(1) drop-shadow(0 0 24px rgba(255,220,150,.5));
    z-index: 3;
  }

  .rpg-dialog {
    position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
    width: 85%; max-width: 900px; min-height: 180px;
    background: rgba(10, 10, 10, 0.92);
    border: 4px solid #c9a54a;
    border-radius: 4px;
    padding: 20px 30px;
    box-shadow: 0 0 0 4px #060504, inset 0 0 20px rgba(0,0,0,0.8);
    color: #fff; z-index: 3; cursor: pointer;
  }
  .rpg-name {
    position: absolute; top: -20px; left: 20px;
    background: #7a241c; color: #f6e6b8;
    padding: 4px 20px; font-size: 20px; font-weight: bold;
    border: 2px solid #d9a86a; border-radius: 2px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.8);
    letter-spacing: .12em;
  }
  .rpg-text {
    font-size: 20px; line-height: 1.7;
    letter-spacing: 1px; margin-top: 10px; color: #e8dcc0;
    text-shadow: 1px 1px 2px #000;
    min-height: 1.7em;
  }
  .rpg-next {
    position: absolute; bottom: 15px; right: 20px;
    font-size: 16px; color: #c9a54a;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .rpg-exit {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    background: #7a241c; color: #f6e6b8; border: 2px solid #d9a86a;
    padding: 8px 16px; cursor: pointer;
    font-family: inherit; font-weight: bold;
    letter-spacing: .1em;
  }
  .rpg-exit:hover { background: #9a3024; }

  .rpg-choices {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    z-index: 6;
    display: none;
    flex-direction: column; gap: 12px;
    width: min(74%, 700px);
  }
  .rpg-choices.show { display: flex; }
  .rpg-choice {
    background: rgba(10,10,10,.94);
    border: 3px solid #c9a54a;
    border-radius: 3px;
    color: #e8dcc0;
    font-family: inherit;
    font-size: clamp(14px, 1.8vw, 19px);
    line-height: 1.5;
    padding: 12px 20px;
    cursor: pointer;
    text-align: left;
    letter-spacing: .04em;
    box-shadow: 0 0 0 2px #060504, 4px 4px 0 rgba(0,0,0,.6);
    transition: background .12s, color .12s, transform .1s, box-shadow .1s;
    animation: choiceIn .22s steps(4, end) both;
  }
  .rpg-choice:hover {
    background: #7a241c;
    color: #fff6d8;
    transform: translate(-2px, -2px);
    box-shadow: 0 0 0 2px #060504, 6px 6px 0 rgba(0,0,0,.6), 0 0 20px rgba(217,180,92,.4);
  }
  @keyframes choiceIn {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .rpg-actions {
    position: absolute; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: none; gap: 16px;
  }
  .rpg-btn {
    background: #7a241c; color: #f6e6b8;
    border: 2px solid #d9a86a;
    padding: 10px 26px; cursor: pointer;
    font-family: inherit; font-size: 16px;
    letter-spacing: .16em;
    box-shadow: 0 0 0 2px #060504, 3px 3px 0 rgba(0,0,0,.6);
  }
  .rpg-btn:hover { background: #9a3024; color: #fff6d8; }

  /* 人物登场卡 */
  .intro-card {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity .35s ease, visibility .35s;
  }
  .intro-card.show { opacity: 1; visibility: visible; }
  .intro-card-inner {
    display: flex; align-items: center; gap: 20px;
    background: rgba(10,10,10,.94);
    border: 3px solid #c9a54a;
    border-radius: 4px;
    padding: 18px 28px;
    box-shadow: 0 0 0 3px #060504, 0 0 40px rgba(217,180,92,.35);
    transform: scale(.85) translateY(10px);
    transition: transform .35s cubic-bezier(.2,1.4,.5,1);
  }
  .intro-card.show .intro-card-inner {
    transform: scale(1) translateY(0);
  }
  .intro-card-img {
    width: 96px; height: 96px;
    object-fit: contain;
    image-rendering: pixelated;
    background: #1a150e;
    border: 2px solid #d9a86a;
  }
  .intro-card-txt { display: flex; flex-direction: column; gap: 6px; }
  .intro-card-name {
    font-size: 26px; color: #f6e6b8; letter-spacing: .2em;
    text-shadow: 2px 2px 0 #000;
  }
  .intro-card-role {
    font-size: 14px; color: #c9a54a; letter-spacing: .12em;
  }
  .intro-card-desc {
    font-size: 15px; color: #c8c4b4; letter-spacing: .04em;
    max-width: 320px; line-height: 1.6;
  }
  .intro-card-hint {
    margin-top: 6px;
    font-size: 12px;
    color: #c9a54a;
    letter-spacing: .16em;
    animation: blink 1.2s step-end infinite;
  }
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="seal">石头<br>记</div>
    <div>
      <div class="cn">大观园试才题对额</div>
      <div class="sub">红楼梦 · 第十七回 · 游览路线图</div>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div class="paper" id="paper"><canvas id="cv"></canvas></div>
    <div class="rod" id="rodL"></div>
    <div class="rod" id="rodR"></div>

    <div class="placard" id="placard">
      <div class="placard-inner">
        <span class="placard-no" id="pno">壹</span>
        <span class="placard-name" id="pname"></span>
      </div>
    </div>

    <div class="dialog" id="dialog">
      <div class="dlg-inner">
        <div class="dlg-bar">
          <span class="dlg-bar-t">游　览　志</span>
          <span class="dlg-step" id="cstep">一 / 九</span>
        </div>
        <div class="dlg-head">
          <span class="dlg-no" id="cno">壹</span>
          <span class="dlg-name" id="cname"></span>
        </div>
        <div class="dlg-plaque" id="cplaque"></div>
        <div class="dlg-text" id="ctext"></div>
        <div class="dlg-foot">
          <span class="dlg-tri">▼</span>
          <span class="dlg-hint" id="chint">自动游览中</span>
          <button class="dlg-enter" id="enterBtn">进 入 此 景 ▶</button>
        </div>
        <div class="dlg-progress"><i id="cprog"></i></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn" id="prev">‹ 前一景</button>
    <button class="btn" id="play">暂停</button>
    <button class="btn" id="next">后一景 ›</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<!-- ========== 复古 RPG 界面层 ========== -->
<div class="rpg-scene" id="rpgScene">
  <div class="rpg-bg" id="rpgBg"></div>

  <div class="intro-card" id="introCard">
    <div class="intro-card-inner">
      <img class="intro-card-img" id="icImg" alt="">
      <div class="intro-card-txt">
        <div class="intro-card-name" id="icName"></div>
        <div class="intro-card-role" id="icRole"></div>
        <div class="intro-card-desc" id="icDesc"></div>
        <div class="intro-card-hint">▼ 点击继续</div>
      </div>
    </div>
  </div>

  <div class="rpg-chars">
    <img id="charL" class="rpg-char left"  alt="">
    <img id="charR" class="rpg-char right" alt="">
  </div>

  <div class="rpg-choices" id="rpgChoices"></div>

  <div class="rpg-dialog" id="rpgDialog">
    <div class="rpg-name" id="rpgName">旁白</div>
    <div class="rpg-text" id="rpgText"></div>
    <div class="rpg-next" id="rpgNext">▼ 点击继续</div>
  </div>

  <div class="rpg-actions" id="rpgActions">
    <button class="rpg-btn" id="retryBtn">重　试</button>
    <button class="rpg-btn" id="backBtn">返 回 卷 轴</button>
  </div>

  <button class="rpg-exit" id="exitRpg">返回卷轴</button>
</div>

<script>
/* ========== 卷轴及 Canvas 代码 ========== */
const W = 480, H = 270, GY = 200;
const WORLD_W = 3200;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

function R(x,y,w,h,c){ x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h); if(w<=0||h<=0) return; ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }

function drawCharacter(t){ const x = Math.round(charX); const bob = Math.sin(t*0.005)*1; const y = Math.round(GY - 24 + bob); ctx.fillStyle = 'rgba(40,50,20,.30)'; ctx.fillRect(x-5, GY-2, 10, 2); R(x-3, y+17, 2, 6, '#2a2418'); R(x+1, y+17, 2, 6, '#2a2418'); R(x-4, y+7, 8, 11, '#a83a34'); R(x-4, y+7, 8, 2, '#c8564a'); R(x-4, y+16, 8, 2, '#7a2420'); R(x-5, y+9, 1, 6, '#8a2a26'); R(x+4, y+9, 1, 6, '#8a2a26'); R(x-4, y+13, 8, 1, C.gold); R(x-3, y, 6, 7, '#f0d6b0'); R(x-3, y, 6, 1, '#fbe8cc'); R(x-3, y-1, 6, 2, '#1c1a20'); R(x-4, y+1, 1, 3, '#1c1a20'); R(x+3, y+1, 1, 3, '#1c1a20'); R(x-2, y-3, 4, 2, '#1c1a20'); R(x-1, y-5, 2, 2, C.gold); R(x-2, y+3, 1, 1, '#2a2018'); R(x+1, y+3, 1, 1, '#2a2018'); R(x+4, y+11, 1, 2, '#8fd0a8'); }

function drawFlakes(t){ const pair = stations[idx].flake; for(let i=0;i<flakes.length;i++){ const f = flakes[i]; f.y += f.vy; f.ph += f.sp; if(f.y > H + 4){ f.y = -4; f.x = Math.random()*W; } const x = f.x + Math.sin(f.ph)*f.sw; const y = f.y; if(x < -6 || x > W+6) continue; ctx.globalAlpha = 0.45 + 0.40*Math.sin(f.ph*1.7 + i); R(x, y, f.sz, f.sz, i%2 ? pair[0] : pair[1]); ctx.globalAlpha = 1; } }
function drawLightPockets(t){ ctx.globalAlpha = 0.045; for(let i=0;i<5;i++){ const x = (i*137 + t*0.006) % (W+120) - 60; disc(x, 150 + (i%2)*30, 34, '#fff4c8'); } ctx.globalAlpha = 1; }

let camX = 0, charX = stations[0].x - 90;
let idx = 0, playing = true, tNow = 0;
let arrived = false;
let started = false;
let waitingEnter = false;
let introPlayed = false;
let placardWaiting = false;

const DWELL = 8200;
const PLACARD_HOLD = 1150;
const PLACARD_GAP  = 1300;

function update(now){ tNow = now; if(!started) return; const s = stations[idx]; const diff = s.x - charX; const step = diff * 0.025; const maxStep = 2.0; charX += clamp(step, -maxStep, maxStep); const camTarget = clamp(charX - W/2, 0, WORLD_W - W); camX += (camTarget - camX) * 0.10; if(!arrived && Math.abs(diff) < 2.5){ charX = s.x; arrived = true; onArrive(); } }
function render(){ ctx.clearRect(0,0,W,H); drawSky(); drawSun(); drawClouds(tNow); drawBirds(tNow); ridge(camX*0.12, 152, C.hill1, 15, 0.008, 0.019, 0.0045); ridge(camX*0.26, 172, C.hill2, 12, 0.011, 0.026, 0.0065); ridge(camX*0.44, 188, C.hill3, 8, 0.015, 0.033, 0.009); drawHorizonMist(); ctx.save(); ctx.translate(-Math.round(camX), 0); const x0 = Math.max(0, Math.round(camX) - 50); const x1 = Math.min(WORLD_W, Math.round(camX) + W + 50); drawGround(x0, x1); drawPath(x0, x1); drawMidTrees(); for(const s of stations){ if(s.x > x0 - 210 && s.x < x1 + 210) s.draw(s.x, GY, tNow); } drawCharacter(tNow); ctx.restore(); drawLightPockets(tNow); drawFlakes(tNow); }
function loop(now){ update(now); render(); tickUI(now); requestAnimationFrame(loop); }

const dialog   = document.getElementById('dialog');
const placard  = document.getElementById('placard');
const pNo      = document.getElementById('pno');
const pName    = document.getElementById('pname');
const elNo     = document.getElementById('cno');
const elName   = document.getElementById('cname');
const elPlaque = document.getElementById('cplaque');
const elText   = document.getElementById('ctext');
const elStep   = document.getElementById('cstep');
const elHint   = document.getElementById('chint');
const elProg   = document.getElementById('cprog');
const elDots   = document.getElementById('dots');
const elPlay   = document.getElementById('play');

const NUM_CN = ['一','二','三','四','五','六','七','八','九'];

let dialogShown = false;
let panelStart  = 0;
let timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

const typing = {full:'', n:0, done:true, acc:0, last:0};
const CHAR_MS = 16;

function startTyping(text){ typing.full = text; typing.n = 0; typing.done = false; typing.acc = 0; typing.last = performance.now(); elText.textContent = ''; }
function tickTyping(now){ if(typing.done) return; typing.acc += now - typing.last; typing.last = now; while(typing.acc >= CHAR_MS && typing.n < typing.full.length){ typing.acc -= CHAR_MS; typing.n++; } if(typing.n < typing.full.length){ elText.textContent = typing.full.slice(0, typing.n) + '▌'; }else{ typing.done = true; elText.textContent = typing.full; } }
function tickUI(now){ tickTyping(now); if(playing && dialogShown){ const span = Math.max(1, DWELL - PLACARD_GAP - 200); const p = clamp((now - panelStart) / span, 0, 1); elProg.style.width = (p*100).toFixed(2) + '%'; } }

function mainName(name){ const i = name.indexOf(' · '); return i > 0 ? name.slice(0, i) : name; }
function hideDialog(){ if(dialogShown){ dialog.classList.remove('show'); dialog.classList.add('hide'); dialogShown = false; } }

function showPanel(s){
  elNo.textContent     = s.no;
  elName.textContent   = s.name;
  elPlaque.textContent = s.plaque;
  elStep.textContent   = NUM_CN[idx] + ' / 九';
  elHint.textContent   = playing ? '自动游览中' : '已暂停';
  elProg.style.width   = '0%';
  startTyping(s.text);
  dialog.classList.remove('hide');
  void dialog.offsetWidth;
  dialog.classList.add('show');
  dialogShown = true;
  panelStart  = performance.now();
}

function onArrive(){
  const s = stations[idx];
  clearTimers();
  placard.classList.remove('show','hide','clickable');
  void placard.offsetWidth;
  pNo.textContent   = s.no;
  pName.textContent = mainName(s.name);
  placard.classList.add('show');

  /* 只有第一站首次需要点击；其他站恢复自动 */
  if (idx === 0 && !introPlayed) {
    placard.classList.add('clickable');
    placardWaiting = true;
  } else {
    timers.push(setTimeout(()=>{ placard.classList.remove('show'); placard.classList.add('hide'); }, PLACARD_HOLD));
    timers.push(setTimeout(()=>{
      showPanel(s);
      waitingEnter = true;
      dialog.classList.add('enterable');
      elHint.textContent = '可进入此景';
    }, PLACARD_GAP));
  }
}

function afterPlacard(){
  const s = stations[idx];
  playing = false;
  elPlay.textContent = '继续';
  playStory('intro', () => {
    introPlayed = true;
    showPanel(s);
    waitingEnter = true;
    dialog.classList.add('enterable');
    elHint.textContent = '可进入此景';
    playing = false;
    elPlay.textContent = '继续';
  });
}

function setStation(i){
  idx = ((i % stations.length) + stations.length) % stations.length;
  arrived = false;
  clearTimers();
  waitingEnter = false;
  placardWaiting = false;
  dialog.classList.remove('enterable');
  hideDialog();
  placard.classList.remove('show','hide','clickable');
  elProg.style.width = '0%';
  [...elDots.children].forEach((d,k)=> d.classList.toggle('on', k===idx));
}

/* ---------- 剧情引擎状态 ---------- */
const rpgScene   = document.getElementById('rpgScene');
const rpgBg      = document.getElementById('rpgBg');
const rpgDialog  = document.getElementById('rpgDialog');
const rpgName    = document.getElementById('rpgName');
const rpgText    = document.getElementById('rpgText');
const rpgNext    = document.getElementById('rpgNext');
const rpgChoices = document.getElementById('rpgChoices');
const rpgActions = document.getElementById('rpgActions');
const charL      = document.getElementById('charL');
const charR      = document.getElementById('charR');
const exitRpg    = document.getElementById('exitRpg');

const introCard = document.getElementById('introCard');
const icImg     = document.getElementById('icImg');
const icName    = document.getElementById('icName');
const icRole    = document.getElementById('icRole');
const icDesc    = document.getElementById('icDesc');
const shownCards = new Set();
let cardWaiting = false;
let pendingText = '';

let storyKey  = null;
let script    = [];
let labels    = {};
let pc        = 0;
let typingNow = false;
let typeTimer = null;
let curFull   = '';
let storyDone = null;
let waitingEnd = false;
let lastChoicePc = -1;

function showIntroCard(who) {
  const actor = CAST[who];
  if (!actor || !actor.role || shownCards.has(who)) return false;
  shownCards.add(who);

  icImg.src = actor.img;
  icName.textContent = actor.name;
  icRole.textContent = actor.role;
  icDesc.textContent = actor.desc || '';

  introCard.classList.add('show');
  cardWaiting = true;
  return true;
}

function setCharImg(el, src) {
  if (!src) { el.style.visibility = 'hidden'; return; }
  if (el.dataset.src === src) { el.style.visibility = 'visible'; return; }
  el.dataset.src = src;
  el.style.visibility = 'hidden';
  el.onload  = () => { el.style.visibility = 'visible'; };
  el.onerror = () => { el.style.visibility = 'hidden'; };
  el.src = src;
}

function setSpeaker(who, emo) {
  const actor = CAST[who];
  if (who === 'player') {
    const emoSrc = (actor.emos && actor.emos[emo]) || actor.img;
    setCharImg(charR, emoSrc);
    charR.classList.add('speaking');
    charL.classList.remove('speaking');
  } else if (who === 'narr' || !actor) {
    charR.classList.remove('speaking');
    charL.classList.remove('speaking');
  } else {
    const emoSrc = (actor.emos && actor.emos[emo]) || actor.img;
    setCharImg(charL, emoSrc);
    charL.classList.add('active');
    charL.classList.add('speaking');
    charR.classList.remove('speaking');
  }
}

function typeText(text) {
  curFull = text;
  typingNow = true;
  rpgText.textContent = '';
  rpgNext.style.display = 'none';
  clearInterval(typeTimer);
  let i = 0;
  typeTimer = setInterval(() => {
    if (i < text.length) {
      rpgText.textContent = text.slice(0, ++i);
    } else {
      clearInterval(typeTimer);
      typingNow = false;
      rpgNext.style.display = 'block';
    }
  }, 26);
}

function doSay(cmd) {
  const actor = CAST[cmd.who] || { name: '旁白' };
  setSpeaker(cmd.who, cmd.emo);
  rpgName.textContent = actor.name;
  const isNew = showIntroCard(cmd.who);
  if (isNew) {
    clearInterval(typeTimer);
    rpgText.textContent = '';
    typingNow = false;
    rpgNext.style.display = 'none';
    pendingText = cmd.text;
  } else {
    typeText(cmd.text);
  }
}

function doChoice(cmd) {
  lastChoicePc = pc;
  rpgChoices.innerHTML = '';
  rpgNext.style.display = 'none';
  cmd.options.forEach((opt, k) => {
    const b = document.createElement('button');
    b.className = 'rpg-choice';
    b.textContent = opt.text;
    b.style.animationDelay = (k * 0.06) + 's';
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      rpgChoices.classList.remove('show');
      rpgChoices.innerHTML = '';
      pc = labels[opt.goto];
      if (pc === undefined) pc = script.length;
      runCmd();
    });
    rpgChoices.appendChild(b);
  });
  rpgChoices.classList.add('show');
}

function runCmd() {
  if (pc >= script.length) { endStory('success'); return; }
  const cmd = script[pc];
  switch (cmd.type) {
    case 'label': pc++; runCmd(); break;
    case 'jump':  pc = (labels[cmd.to] === undefined ? script.length : labels[cmd.to]); runCmd(); break;
    case 'say':   doSay(cmd); break;
    case 'choice': doChoice(cmd); break;
    case 'end':   endStory(cmd.result, cmd.text); break;
    default: pc++; runCmd();
  }
}

function endStory(result, text) {
  if (result === 'success') { exitStory(true); return; }
  waitingEnd = true;
  typingNow = false;
  clearInterval(typeTimer);
  rpgNext.style.display = 'none';
  rpgChoices.classList.remove('show');
  rpgChoices.innerHTML = '';
  rpgName.textContent = (result === 'fail') ? '小 失 败' : '游 园 结 束';
  rpgText.textContent = text || '游园考验到此为止。';
  rpgText.style.whiteSpace = 'pre-line';
  rpgActions.style.display = 'flex';
}

function exitStory(continueTour) {
  rpgScene.classList.remove('show');
  introCard.classList.remove('show');
  cardWaiting = false;
  pendingText = '';
  rpgActions.style.display = 'none';
  rpgChoices.classList.remove('show');
  rpgChoices.innerHTML = '';
  rpgText.style.whiteSpace = 'normal';
  waitingEnd = false;
  typingNow = false;
  clearInterval(typeTimer);
  charL.classList.remove('active', 'speaking');
  charR.classList.remove('active', 'speaking');
  const cb = storyDone;
  storyDone = null;
  if (cb) cb(continueTour ? 'success' : 'exit');
}

function playStory(key, onDone) {
  const s = STORY[key];
  if (!s) { if (onDone) onDone('success'); return; }
  storyKey = key;
  script = s.script;
  labels = {};
  script.forEach((cmd, i) => { if (cmd.type === 'label') labels[cmd.name] = i; });
  pc = 0;
  lastChoicePc = -1;
  storyDone = onDone;

  rpgBg.style.backgroundImage = `url('${s.bg}')`;
  rpgScene.classList.add('show');
  rpgActions.style.display = 'none';
  rpgChoices.classList.remove('show');
  rpgChoices.innerHTML = '';
  rpgText.style.whiteSpace = 'normal';
  rpgText.textContent = '';
  rpgName.textContent = '旁白';
  rpgNext.style.display = 'none';
  introCard.classList.remove('show');
  cardWaiting = false;
  pendingText = '';

  setCharImg(charR, CAST.player.img);
  charR.classList.add('active');
  charR.classList.remove('speaking');
  charL.classList.remove('active', 'speaking');

  exitRpg.style.display = (key === 'intro') ? 'none' : 'block';

  runCmd();
}

/* ---------- 点击推进 ---------- */
rpgScene.addEventListener('click', (e) => {
  if (e.target.closest('.rpg-choice, .rpg-btn, .rpg-exit')) return;

  if (cardWaiting) {
    cardWaiting = false;
    introCard.classList.remove('show');
    typeText(pendingText);
    return;
  }

  if (waitingEnd) return;
  if (rpgChoices.classList.contains('show')) return;

  if (typingNow) {
    clearInterval(typeTimer);
    rpgText.textContent = curFull;
    typingNow = false;
    rpgNext.style.display = 'block';
    return;
  }
  pc++;
  runCmd();
});

exitRpg.addEventListener('click', (e) => {
  e.stopPropagation();
  exitStory(false);
});

document.getElementById('retryBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (lastChoicePc < 0) { exitStory(false); return; }

  waitingEnd = false;
  typingNow = false;
  clearInterval(typeTimer);

  rpgActions.style.display = 'none';
  rpgChoices.classList.remove('show');
  rpgChoices.innerHTML = '';
  rpgText.style.whiteSpace = 'normal';
  rpgText.textContent = '';
  rpgName.textContent = '旁白';
  rpgNext.style.display = 'none';

  charL.classList.remove('speaking');
  charR.classList.remove('speaking');

  pc = lastChoicePc;
  runCmd();
});

document.getElementById('backBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  exitStory(false);
});

/* ---------- 卷轴 ↔ 剧情 衔接 ---------- */
function enterScene() {
  if (!waitingEnter) return;
  waitingEnter = false;
  playing = false;
  hideDialog();
  placard.classList.remove('show', 'hide', 'clickable');
  dialog.classList.remove('enterable');
  elPlay.textContent = '继续';

  playStory('s' + idx, (result) => {
    if (result === 'success') {
      playing = true;
      elPlay.textContent = '暂停';
      elHint.textContent = '自动游览中';
    } else {
      reshowDialog();
    }
  });
}

function reshowDialog() {
  const s = stations[idx];
  showPanel(s);
  waitingEnter = true;
  dialog.classList.add('enterable');
  elHint.textContent = '可进入此景';
  playing = false;
  elPlay.textContent = '继续';
}

document.getElementById('enterBtn').addEventListener('click', enterScene);

/* placard 点击：仅第一站首次可点 */
placard.addEventListener('click', () => {
  if (!placardWaiting) return;
  placardWaiting = false;
  placard.classList.remove('show', 'clickable');
  placard.classList.add('hide');
  afterPlacard();
});

stations.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className = 'dot' + (i===0?' on':'');
  b.title = s.name;
  b.addEventListener('click', ()=>{ setStation(i); });
  elDots.appendChild(b);
});
document.getElementById('prev').addEventListener('click', ()=> setStation(idx-1));
document.getElementById('next').addEventListener('click', ()=> setStation(idx+1));
elPlay.addEventListener('click', ()=>{
  playing = !playing;
  elPlay.textContent = playing ? '暂停' : '继续';
  elHint.textContent = playing ? '自动游览中' : '已暂停';
  if(playing){ if(dialogShown) panelStart = performance.now(); }
});
window.addEventListener('keydown', e=>{
  if (rpgScene.classList.contains('show')) return;
  if(e.key === 'ArrowRight') setStation(idx+1);
  if(e.key === 'ArrowLeft') setStation(idx-1);
  if(e.key === 'Enter' && waitingEnter) enterScene();
});

/* ---------- 卷轴展开 ---------- */
const paper = document.getElementById('paper');
const rodL  = document.getElementById('rodL');
const rodR  = document.getElementById('rodR');
const easeOutCubic = x => 1 - Math.pow(1-x, 3);

function unroll(){
  const dur = 1900;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0)/dur);
    const e = easeOutCubic(p);
    const half = 50 * (1 - e);
    paper.style.clipPath = `inset(0 ${half}% 0 ${half}%)`;
    rodL.style.left = half + '%';
    rodR.style.left = (100 - half) + '%';
    if(p < 1){
      requestAnimationFrame(step);
    }else{
      paper.style.clipPath = 'inset(0 0 0 0)';
      document.body.classList.add('ready');
      started = true;
      setStation(0);
      playing = false;
      elPlay.textContent = '继续';
    }
  }
  requestAnimationFrame(step);
}

requestAnimationFrame(loop);
setTimeout(unroll, 420);
